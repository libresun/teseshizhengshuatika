    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("doneBox").style.display = "block";
    document.getElementById("totalNum").innerText = order.length;
    document.getElementById("finalRight").innerText = right;
    document.getElementById("finalWrong").innerText = wrong;
    return;
  }
  const item = questionBank[order[idx]];
  document.getElementById("qCounter").innerText = `第 ${idx + 1} / ${order.length} 题`;
  document.getElementById("progressFill").style.width = ((idx) / order.length * 100) + "%";
  document.getElementById("qTag").innerText = item.tag;
  document.getElementById("qTitle").innerText = item.q;
  document.getElementById("ansHint").style.display = "none";

  const wrap = document.getElementById("optionWrap");
  wrap.innerHTML = "";
  shuffle(item.options).forEach(opt => {
    const div = document.createElement("div");
    div.className = "option-item";
    div.innerText = opt;
    div.onclick = function () {
      const all = document.querySelectorAll(".option-item");
      all.forEach(el => el.classList.add("disabled"));
      if (opt === item.answer) {
        div.classList.add("right");
        right++;
      } else {
        div.classList.add("wrong");
        all.forEach(el => { if (el.innerText === item.answer) el.classList.add("right"); });
        wrong++;
      }
      document.getElementById("ansText").innerText = item.answer;
      document.getElementById("ansHint").style.display = "block";
      document.getElementById("rightCount").innerText = right;
      document.getElementById("wrongCount").innerText = wrong;
    };
    wrap.appendChild(div);
  });
}

function init() {
  order = shuffle(questionBank.map((_, i) => i));
  idx = 0; right = 0; wrong = 0;
  document.getElementById("rightCount").innerText = 0;
  document.getElementById("wrongCount").innerText = 0;
  document.getElementById("quizArea").style.display = "block";
  document.getElementById("btnWrap").style.display = "flex";
  document.getElementById("doneBox").style.display = "none";
  render();
}

document.getElementById("nextBtn").onclick = () => { idx++; render(); };
document.getElementById("resetBtn").onclick = init;
document.getElementById("againBtn").onclick = init;
window.onload = init;
</script>
